    <path d="M-58 -8 C-20 -60, 20 -60, 58 -8" fill="none" stroke="#94a3b8" stroke-width="8"/>
    <path d="M-58 8 C-20 60, 20 60, 58 8" fill="none" stroke="#94a3b8" stroke-width="8"/>
    <path d="M-8 -58 C-60 -20, -60 20, -8 58" fill="none" stroke="#94a3b8" stroke-width="8"/>
    <path d="M8 -58 C60 -20, 60 20, 8 58" fill="none" stroke="#94a3b8" stroke-width="8"/>
  </g>

  <text x="140" y="145" fill="#ffffff" font-size="56" font-family="Segoe UI, Arial, sans-serif" font-weight="800">FanLore</text>
  <text x="140" y="205" fill="#cbd5e1" font-size="32" font-family="Segoe UI, Arial, sans-serif" font-weight="500">Sports fan stories, rivalries, stats, and culture</text>

