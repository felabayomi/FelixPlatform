<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">FanLore Sports Preview</title>
  <desc id="desc">Sports fan community themed preview image for the FanLore app card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="160" cy="110" r="120" fill="#38bdf8" opacity="0.25"/>
  <circle cx="1040" cy="560" r="170" fill="#86efac" opacity="0.22"/>

  <rect x="80" y="80" width="1040" height="515" rx="22" fill="#0b1223" opacity="0.78"/>
  <rect x="120" y="360" width="960" height="190" rx="18" fill="url(#field)"/>

  <line x1="180" y1="455" x2="1020" y2="455" stroke="#dcfce7" stroke-width="6" opacity="0.7"/>
  <circle cx="600" cy="455" r="48" fill="none" stroke="#dcfce7" stroke-width="6" opacity="0.7"/>

  <g transform="translate(180 170)">
    <path d="M0 70 C40 25, 120 25, 160 70 C160 140, 0 140, 0 70Z" fill="#f97316"/>
    <path d="M15 70 C52 40, 108 40, 145 70" fill="none" stroke="#7c2d12" stroke-width="8"/>
    <path d="M15 70 C52 100, 108 100, 145 70" fill="none" stroke="#7c2d12" stroke-width="8"/>
    <rect x="74" y="60" width="12" height="20" rx="4" fill="#fef3c7"/>
