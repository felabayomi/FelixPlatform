<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">FinancialReadiness Preview</title>
  <desc id="desc">Financial planning themed preview image for the FinancialReadiness app card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="100%" stop-color="#123a6b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ee7ff"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="170" fill="#1f4e85" opacity="0.35"/>
  <circle cx="180" cy="560" r="220" fill="#1d6fb7" opacity="0.28"/>

  <rect x="90" y="110" rx="18" ry="18" width="1020" height="455" fill="#0f2d52" opacity="0.86"/>
  <rect x="130" y="150" rx="10" ry="10" width="470" height="22" fill="url(#accent)" opacity="0.95"/>

  <text x="130" y="225" fill="#ffffff" font-size="54" font-family="Segoe UI, Arial, sans-serif" font-weight="700">FinancialReadiness</text>
  <text x="130" y="275" fill="#d6e8ff" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="500">Debt to Legacy</text>

  <text x="130" y="340" fill="#c4dbf8" font-size="28" font-family="Segoe UI, Arial, sans-serif">Plan debt payoff, protect your future, and build generational strength.</text>

  <rect x="130" y="395" rx="12" ry="12" width="330" height="78" fill="#2f6fff"/>
  <text x="170" y="445" fill="#ffffff" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700">iOS App</text>

  <g transform="translate(760 250)">
    <rect x="0" y="0" width="280" height="180" rx="16" ry="16" fill="#133a66"/>
    <path d="M45 128 L95 82 L145 108 L200 62 L235 84" fill="none" stroke="#8af0c5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="45" cy="128" r="8" fill="#8af0c5"/>
    <circle cx="95" cy="82" r="8" fill="#8af0c5"/>
    <circle cx="145" cy="108" r="8" fill="#8af0c5"/>
    <circle cx="200" cy="62" r="8" fill="#8af0c5"/>
    <circle cx="235" cy="84" r="8" fill="#8af0c5"/>
  </g>
</svg>
