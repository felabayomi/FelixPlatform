[build]
  base = "."
  command = "npm install -g pnpm && pnpm install --frozen-lockfile && pnpm -r --filter @workspace/api-client-react --filter @workspace/api-zod --filter @workspace/db --filter @workspace/integrations-openai-ai-server --filter @workspace/integrations-openai-ai-react build && pnpm --filter @workspace/travel-showcase run build"
  publish = "artifacts/travel-showcase/dist/public"

[build.environment]
  NODE_VERSION = "20"

# Proxy /api/* to the Render backend — set TRAVEL_TV_API_URL in Netlify env vars
[[redirects]]
  from = "/api/*"
  to = "https://felix-travel-tv-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback — all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
